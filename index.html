<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffc9d6">
<title>どうぶつまなびランド</title>
<style>
:root{--bg:#fff6e9;--card:#ffffff;--ink:#5a4a42;--sub:#a08c80;--pink:#ffc9d6;--mint:#c6efd9;--sky:#c8e3ff;--lemon:#fff0b3;--hole:#ece2d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2530;--card:#3a3340;--ink:#fbeee4;--sub:#c4b3b0;--hole:#4b4352;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{display:none;min-height:100%;padding:14px 14px 20px;max-width:560px;margin:0 auto;flex-direction:column;gap:12px}
.screen.on{display:flex}
h1{margin:4px 0 0;text-align:center;font-size:1.7rem}
.mascots{text-align:center;font-size:2.4rem;letter-spacing:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbtn{border:0;border-radius:24px;padding:16px 8px;font:inherit;font-size:1.05rem;color:var(--ink);min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.08);position:relative}
.gbtn b{font-size:2.2rem;font-weight:400}
.gbtn:active{transform:translateY(3px);box-shadow:none}
.gbtn.lock{opacity:.55}
.gbtn small{font-size:.7rem;color:var(--sub)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-size:.95rem;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.btn{border:0;background:var(--card);color:var(--ink);font:inherit;border-radius:999px;padding:10px 16px;min-height:44px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn.sel{background:var(--lemon);color:#5a4a42;font-weight:700}
.btn.big{background:var(--mint);color:#3d5a4b;font-size:1.2rem;padding:14px 28px}
.stats{background:var(--card);border-radius:20px;padding:10px 14px;display:flex;justify-content:space-around;text-align:center;font-size:.85rem;color:var(--sub)}
.stats strong{display:block;font-size:1.3rem;color:var(--ink)}
.prompt{text-align:center;font-size:1.15rem;min-height:1.6em}
.board{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;background:var(--card);border-radius:28px;padding:14px;min-height:150px}
.hole{width:min(27vw,112px);aspect-ratio:1;border-radius:22px;background:var(--hole);display:grid;place-items:center;position:relative}
.hole svg,.piece svg{width:78%;height:78%;display:block;overflow:visible}
.hole .fill{display:none}
.hole.done{background:transparent}
.hole.done .out{display:none}
.hole.done .fill{display:block;animation:pop .5s}
.hole .ani{position:absolute;font-size:1.6rem;top:30%;left:50%;transform:translateX(-50%);opacity:0}
.hole.done .ani{opacity:1;animation:pop .6s}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;background:var(--card);border-radius:28px;padding:14px;min-height:140px;position:relative}
.slot{width:min(25vw,100px);aspect-ratio:1}
.piece{width:100%;height:100%;display:grid;place-items:center;touch-action:none;cursor:grab;position:relative;z-index:1}
.piece.drag{z-index:50;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));transform:scale(1.15)}
.piece.back{transition:transform .25s}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes up{to{transform:translateY(-110px) rotate(40deg);opacity:0}}
.fx{position:fixed;pointer-events:none;font-size:2rem;animation:up 1s forwards;z-index:99}
.clear{display:none;text-align:center;gap:10px;flex-direction:column;align-items:center}
.clear.on{display:flex}
.clear .st{font-size:2.2rem;animation:pop .6s}
.toast{text-align:center;color:var(--sub);font-size:.85rem}
.big{font-size:5.5rem;text-align:center;line-height:1.1}.sil{filter:brightness(0);opacity:.55}
.stim{background:var(--card);border-radius:28px;padding:18px;text-align:center;font-size:2.6rem;min-height:130px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.choice{border:0;border-radius:28px;background:var(--card);color:var(--ink);font:inherit;font-size:3rem;min-width:28vw;min-height:110px;box-shadow:0 5px 0 rgba(0,0,0,.1);display:grid;place-items:center;padding:8px 14px;max-width:160px}
.choice:active{transform:translateY(4px)}
.dot{display:block;width:64px;height:64px;border-radius:50%}
.mz{display:grid;margin:0 auto;width:min(92vw,420px);aspect-ratio:1;background:var(--card);border-radius:12px;touch-action:none}
.mz div{display:grid;place-items:center;font-size:clamp(1.2rem,6vw,2rem);border:0 solid #b9a595}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center;margin-top:12px}
.pad .btn{font-size:1.6rem;padding:0;height:64px}
canvas{background:#fff;border-radius:20px;touch-action:none;display:block;margin:0 auto;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 2px 0 rgba(0,0,0,.15);padding:0}
.sw.on{border-color:var(--ink)}
.bar{flex-wrap:wrap}.mascots{padding-top:1.1rem}
.mw{position:relative;display:inline-block;margin:0 4px;cursor:pointer}
.ht{position:absolute;top:-.6em;left:50%;transform:translateX(-50%) rotate(-12deg);font-size:.6em;font-style:normal;pointer-events:none}
.hop{animation:hop .4s}@keyframes hop{40%{transform:translateY(-14px) scale(1.15)}}
</style>
</head>
<body>

<section class="screen on" id="home">
  <h1>どうぶつまなびランド</h1>
  <div class="mascots" id="mas"></div>
  <div class="grid" id="menu"></div>
  <div class="stats">
    <div><strong id="hStars">0</strong>ほし</div>
    <div><strong id="hPlays">0</strong>あそんだ</div>
    <div><strong id="hOk">0</strong>せいかい</div>
  </div>
  <div class="bar"><button class="btn" id="shopb">👑 きせかえ</button><button class="btn" id="bgm">🎵 おんがく</button><button class="btn" id="snd">🔊 おと</button></div>
</section>

<section class="screen" id="game">
  <div class="bar">
    <button class="btn" id="back">← もどる</button>
    <span class="pill">⭐ <span id="gStars">0</span></span>
  </div>
  <div class="bar" style="justify-content:center">
    <button class="btn" data-lv="1">かんたん</button>
    <button class="btn" data-lv="2">ふつう</button>
    <button class="btn" data-lv="3">むずかしい</button>
  </div>
  <div class="prompt" id="msg">かたちを おなじ ばしょに ドラッグ！</div>
  <div class="board" id="board"></div>
  <div class="tray" id="tray"></div>
  <div class="clear" id="clear">
    <div class="st">⭐🎉⭐</div>
    <div>すごい！ ぜんぶ はまったよ</div>
    <button class="btn big" id="next">つぎへ ▶</button>
  </div>
</section>

<section class="screen" id="shop">
  <div class="bar"><button class="btn" id="sback">← もどる</button><b>きせかえ</b><span class="pill">⭐ <span id="shStars">0</span></span></div>
  <div class="mascots" id="mas2"></div>
  <div class="toast">ほしを つかって きせかえよう（ほしは へるよ）</div>
  <div class="bar" style="justify-content:center"><button class="btn sel" id="tabh">ぼうし</button><button class="btn" id="tabb">はいけい</button></div>
  <div class="grid" id="items"></div>
</section>

<section class="screen" id="play">
  <div class="bar"><button class="btn" id="pback">← もどる</button><b id="ptitle"></b><span class="pill">⭐ <span id="pStars">0</span></span></div>
  <div class="prompt" id="pmsg"></div>
  <div id="pbody"></div>
</section>

<script>
(function(){
var SHAPES={
  circle:'<circle cx="50" cy="50" r="42"/>',
  triangle:'<polygon points="50,8 94,88 6,88" stroke-linejoin="round"/>',
  square:'<rect x="10" y="10" width="80" height="80" rx="10"/>',
  star:'<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38" stroke-linejoin="round"/>',
  heart:'<path d="M50 90C10 60 6 30 28 18C40 12 50 22 50 30C50 22 60 12 72 18C94 30 90 60 50 90Z"/>'
};
var COLORS=['#ffb3c6','#a8ddc2','#a9d3ff','#ffe58f','#d6bcff'];
var ANIMALS=['🐶','🐱','🐰','🐻','🐼'];
var ORDER=['circle','triangle','square','star','heart'];
var NUM={1:3,2:4,3:5};
var save={stars:0,plays:0,ok:0,ng:0,lv:1,snd:true};
try{var s=JSON.parse(localStorage.getItem('dmland')||'null');if(s)for(var k in s)save[k]=s[k];}catch(e){}
function persist(){try{localStorage.setItem('dmland',JSON.stringify(save));}catch(e){}}
function $(id){return document.getElementById(id);}
function show(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.toggle('on',x.id===id);});if(id==='home')refresh();}
function refresh(){$('hStars').textContent=save.stars;$('hPlays').textContent=save.plays;$('hOk').textContent=save.ok;$('gStars').textContent=save.stars;$('snd').textContent=save.snd?'🔊 おと':'🔇 おと';}

var ac=null;
function tone(f,d,t){if(!save.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.15;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function good(){tone(660,.15);setTimeout(function(){tone(880,.25);},120);}
function bad(){tone(220,.25,'triangle');}
function cheer(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.25);},i*120);});}

var games=[
 ['🔷','かたちはめこみ',1],['🐾','どうぶつマッチング',0],['🎨','いろあわせ',0],['🔢','かずあそび',0],
 ['📏','おおきい ちいさい',0],['🔊','なきごえクイズ',0],['🧭','どうぶつめいろ',0],['🖍️','おえかきどうぶつ',0]];
var bgs=['var(--pink)','var(--mint)','var(--sky)','var(--lemon)','var(--pink)','var(--mint)','var(--sky)','var(--lemon)'];
games.forEach(function(g,i){
  var b=document.createElement('button');b.className='gbtn';b.style.background=bgs[i];
  b.innerHTML='<b>'+g[0]+'</b>'+g[1];
  b.onclick=function(){if(i===0){startGame();}else{PLAY(i);return;tone(300,.2,'triangle');b.classList.add('shake');setTimeout(function(){b.classList.remove('shake');},400);}};
  $('menu').appendChild(b);
});
$('snd').onclick=function(){save.snd=!save.snd;persist();refresh();};
$('back').onclick=function(){show('home');};
document.querySelectorAll('[data-lv]').forEach(function(b){b.onclick=function(){save.lv=+b.dataset.lv;persist();newRound();};});
$('next').onclick=newRound;

var placed=0,total=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function svg(name,color,cls){return '<svg class="'+(cls||'')+'" viewBox="0 0 100 100">'+SHAPES[name].replace('/>',' fill="'+color+'" stroke="'+color+'" stroke-width="'+(cls==='out'?3:4)+'"/>')+'</svg>';}
function outline(name){return '<svg class="out" viewBox="0 0 100 100">'+SHAPES[name].replace('/>',' fill="none" stroke="#b8a898" stroke-width="3" stroke-dasharray="6 6"/>')+'</svg>';}

function startGame(){show('game');newRound();}
function newRound(){
  document.querySelectorAll('[data-lv]').forEach(function(b){b.classList.toggle('sel',+b.dataset.lv===save.lv);});
  $('clear').classList.remove('on');$('msg').textContent='かたちを おなじ ばしょに ドラッグ！';
  var n=NUM[save.lv],names=shuffle(ORDER.slice()).slice(0,n);
  total=n;placed=0;save.plays++;persist();refresh();
  var board=$('board'),tray=$('tray');board.innerHTML='';tray.innerHTML='';
  var holes=shuffle(names.slice()),pieces=shuffle(names.slice());
  holes.forEach(function(nm){
    var i=ORDER.indexOf(nm),h=document.createElement('div');h.className='hole';h.dataset.shape=nm;
    h.innerHTML=outline(nm)+'<span class="fillwrap" style="display:contents">'+svg(nm,COLORS[i],'fill')+'</span><span class="ani">'+ANIMALS[i]+'</span>';
    board.appendChild(h);
  });
  pieces.forEach(function(nm){
    var i=ORDER.indexOf(nm),slot=document.createElement('div');slot.className='slot';
    var p=document.createElement('div');p.className='piece';p.dataset.shape=nm;p.innerHTML=svg(nm,COLORS[i]);
    slot.appendChild(p);tray.appendChild(slot);bindDrag(p);
  });
}
function fx(x,y,t){var e=document.createElement('div');e.className='fx';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(function(){e.remove();},1000);}
function bindDrag(p){
  var sx=0,sy=0,id=null;
  p.addEventListener('pointerdown',function(e){
    if(p.classList.contains('gone'))return;
    id=e.pointerId;p.setPointerCapture(id);sx=e.clientX;sy=e.clientY;
    p.classList.remove('back');p.classList.add('drag');
  });
  p.addEventListener('pointermove',function(e){
    if(e.pointerId!==id)return;
    p.style.transform='translate('+(e.clientX-sx)+'px,'+(e.clientY-sy)+'px) scale(1.15)';
  });
  function end(e){
    if(e.pointerId!==id)return;id=null;
    p.classList.remove('drag');
    var r=p.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,hit=null;
    document.querySelectorAll('.hole:not(.done)').forEach(function(h){
      var q=h.getBoundingClientRect();
      if(cx>q.left&&cx<q.right&&cy>q.top&&cy<q.bottom)hit=h;
    });
    if(hit&&hit.dataset.shape===p.dataset.shape){
      hit.classList.add('done');p.classList.add('gone');p.style.visibility='hidden';
      save.ok++;placed++;good();var q=hit.getBoundingClientRect();fx(q.left+q.width/2,q.top,'⭐');
      $('msg').textContent='せいかい！';
      if(placed===total){save.stars+=save.lv;persist();cheer();$('msg').textContent='⭐ +'+save.lv+' ゲット！';$('clear').classList.add('on');refresh();
        setTimeout(function(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});},100);}
      persist();
    }else{
      if(hit){save.ng++;persist();bad();$('msg').textContent='おしい！ もういちど';hit.classList.add('shake');setTimeout(function(){hit.classList.remove('shake');},400);}
      p.classList.add('back');p.style.transform='';
    }
  }
  p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
}
var AN=[['🐶','わんわん'],['🐱','にゃーん'],['🐰','ぴょんぴょん'],['🐮','もーもー'],['🐷','ぶーぶー'],['🐸','げろげろ'],['🐥','ぴよぴよ'],['🐘','ぱおーん']];
var CL=[['あか','#ff8a8a'],['あお','#8ac0ff'],['きいろ','#ffe066'],['みどり','#8ee0a8'],['ピンク','#ffb3d9'],['オレンジ','#ffb866'],['むらさき','#c9a8ff']];
var mn=4;
function pick(a,n){return shuffle(a.slice()).slice(0,n);}
function opts(c,pool,n){var o=pick(pool.filter(function(x){return x!==c;}),n-1);o.push(c);return shuffle(o);}
function addStar(n){save.stars+=n;persist();refresh();$('pStars').textContent=save.stars;}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;if(save.snd)speechSynthesis.speak(u);}catch(e){}}
var Q={
1:function(){var a=pick(AN,1)[0];return{p:'かげは だれかな？',s:'<div class="big sil">'+a[0]+'</div>',c:opts(a,AN,3).map(function(x){return{h:x[0],ok:x===a};})};},
2:function(){var c=pick(CL,1)[0];return{p:c[0]+'は どれ？',s:'<div class="big">🎨</div>',c:opts(c,CL,3).map(function(x){return{h:'<i class="dot" style="background:'+x[1]+'"></i>',ok:x===c};})};},
3:function(){var a=pick(AN,1)[0],n=1+Math.floor(Math.random()*6),pool=[1,2,3,4,5,6,7,8];return{p:'いくつ いるかな？',s:new Array(n+1).join(a[0]),c:opts(n,pool,3).map(function(x){return{h:x,ok:x===n};})};},
4:function(){var a=pick(AN,1)[0],big=Math.random()<.5,sz=shuffle([34,56,84]);return{p:big?'おおきいのは どれ？':'ちいさいのは どれ？',s:'',c:sz.map(function(z){return{h:'<span style="font-size:'+z+'px">'+a[0]+'</span>',ok:z===(big?84:34)};})};},
5:function(){var a=pick(AN,1)[0];return{p:a[1]+'！ だれかな？',say:a[1],s:'<div class="big">🔊</div>',c:opts(a,AN,3).map(function(x){return{h:x[0],ok:x===a};})};}
};
function quiz(id){
  var n=0;
  function next(){
    if(n===5){return fin();}
    n++;var q=Q[id]();$('pmsg').textContent=q.p+' ('+n+'/5)';if(q.say)say(q.say);
    $('pbody').innerHTML='<div class="stim">'+q.s+'</div><div class="choices"></div>';
    var box=$('pbody').lastChild;
    q.c.forEach(function(c){var e=document.createElement('button');e.className='choice';e.innerHTML=c.h;
      e.onclick=function(){if(c.ok){good();save.ok++;persist();var r=e.getBoundingClientRect();fx(r.left+r.width/2,r.top,'⭐');setTimeout(next,550);}
      else{bad();e.classList.add('shake');setTimeout(function(){e.classList.remove('shake');},400);}};box.appendChild(e);});
  }
  function fin(){addStar(1);cheer();$('pmsg').textContent='⭐ +1 ゲット！';
    $('pbody').innerHTML='<div class="clear on"><div class="st">⭐🎉⭐</div><button class="btn big" id="again">もういちど ▶</button></div>';
    $('again').onclick=function(){quiz(id);};}
  next();
}
function maze(){
  var N=mn,w=[],seen={0:1},st=[0],pos=0,i;
  for(i=0;i<N*N;i++)w[i]=[1,1,1,1];
  while(st.length){var c=st[st.length-1],x=c%N,y=c/N|0,nb=[];
    [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny*N+nx])nb.push([ny*N+nx,d[2],d[3]]);});
    if(!nb.length){st.pop();continue;}
    var t=nb[Math.floor(Math.random()*nb.length)];w[c][t[1]]=0;w[t[0]][t[2]]=0;seen[t[0]]=1;st.push(t[0]);}
  $('pmsg').textContent='🐶を 🏠まで つれていこう！ (スワイプ OK)';
  $('pbody').innerHTML='<div class="mz" id="mz" style="grid-template-columns:repeat('+N+',1fr)"></div><div class="pad"><span></span><button class="btn" data-d="0">▲</button><span></span><button class="btn" data-d="3">◀</button><span></span><button class="btn" data-d="1">▶</button><span></span><button class="btn" data-d="2">▼</button><span></span></div>';
  var m=$('mz'),sx=0,sy=0;
  function render(){var g='';for(i=0;i<N*N;i++){var q=w[i];g+='<div style="border-width:'+q[0]*3+'px '+q[1]*3+'px '+q[2]*3+'px '+q[3]*3+'px">'+(i===pos?ANIMALS[0]:i===N*N-1?'🏠':'')+'</div>';}m.innerHTML=g;}
  function go(d){if(w[pos][d]||pos===N*N-1)return;pos+=[-N,1,N,-1][d];tone(420+pos*8,.08);render();
    if(pos===N*N-1){addStar(1);cheer();mn=Math.min(mn+1,8);$('pmsg').textContent='⭐ +1 ゴール！';
      $('pbody').insertAdjacentHTML('beforeend','<div class="clear on" style="margin-top:12px"><button class="btn big" id="again">つぎの めいろ ▶</button></div>');$('again').onclick=maze;}}
  document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){go(+b.dataset.d);};});
  m.onpointerdown=function(e){sx=e.clientX;sy=e.clientY;};
  m.onpointerup=function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;go(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));};
  render();
}
function paint(){
  var W=Math.min(innerWidth-28,520),H=W,cols=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#b197fc','#f783ac','#8b5e3c','#212529','#ffffff'],col=cols[0],sizes=[8,16,28],si=1,ai=0,got=0,pal='';
  cols.forEach(function(c,k){pal+='<button class="sw'+(k?'':' on')+'" data-c="'+c+'" style="background:'+c+'"></button>';});
  $('pmsg').textContent='すきないろで おえかきしよう！';
  $('pbody').innerHTML='<canvas id="cv" width="'+W+'" height="'+H+'"></canvas><div class="pal">'+pal+'</div><div class="bar" style="justify-content:center;flex-wrap:wrap"><button class="btn" id="sz">✏️ ふとさ</button><button class="btn" id="an">🐾 どうぶつ</button><button class="btn" id="cl">🗑️ けす</button><button class="btn big" id="ok">できた！</button></div>';
  var cv=$('cv'),x=cv.getContext('2d'),on=false;
  function bg(){x.globalAlpha=1;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.globalAlpha=.22;x.font=(W*.75)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.fillText(AN[ai][0],W/2,H/2);x.globalAlpha=1;}
  function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
  cv.onpointerdown=function(e){on=true;cv.setPointerCapture(e.pointerId);var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]);x.strokeStyle=col;x.lineWidth=sizes[si];x.lineCap=x.lineJoin='round';x.stroke();};
  cv.onpointermove=function(e){if(!on)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke();};
  cv.onpointerup=cv.onpointercancel=function(){on=false;};
  document.querySelectorAll('.sw').forEach(function(b){b.onclick=function(){col=b.dataset.c;document.querySelectorAll('.sw').forEach(function(o){o.classList.toggle('on',o===b);});};});
  $('sz').onclick=function(){si=(si+1)%3;this.textContent='✏️ '+['ほそい','ふつう','ふとい'][si];};
  $('an').onclick=function(){ai=(ai+1)%AN.length;bg();};
  $('cl').onclick=bg;
  $('ok').onclick=function(){if(got)return;got=1;addStar(1);cheer();$('pmsg').textContent='⭐ +1 ゲット！ じょうず！';};
  bg();
}
$('pback').onclick=function(){try{speechSynthesis.cancel();}catch(e){}show('home');};
window.PLAY=function(i){
  show('play');$('ptitle').textContent=games[i][0]+' '+games[i][1];$('pStars').textContent=save.stars;save.plays++;persist();
  if(i<=5)quiz(i);else if(i===6)maze();else paint();
};
save.own=save.own||['h:none','b:0'];save.hat=save.hat||'none';save.bg=save.bg||0;
var HATS=[['none','なし',0],['🎀','リボン',2],['🌸','おはな',3],['🎩','シルクハット',5],['👑','おうかん',8],['🎓','がくしぼう',10]];
var BGS=[['#fff6e9','クリーム',0],['#e6f7ee','ミント',4],['#ffe9ef','さくら',4],['#e5f1ff','そら',6],['linear-gradient(#ffd6e8,#d6ecff)','にじ',12],['linear-gradient(#fff3b0,#ffc6d9)','ゆうやけ',14]];
var tab='h',streak=0,bt=null,PENT=[523,587,659,784,880,1047,1175];
function tone(f,d,t,v,dl){if(!save.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();var T=ac.currentTime+(dl||0),o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d);}catch(e){}}
function good(){var f=PENT[Math.min(streak,6)];streak++;tone(f,.18,'sine',.16);tone(f*1.5,.3,'triangle',.07,.07);}
function bad(){streak=0;tone(300,.12,'triangle',.12);tone(220,.22,'triangle',.1,.1);}
function cheer(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.3,'triangle',.14,i*.09);});tone(2093,.5,'sine',.06,.55);}
function unlock(){[880,1175,1568,2093,2637].forEach(function(f,i){tone(f,.25,'sine',.09,i*.06);});tone(1047,.6,'triangle',.08,.1);}
function chirp(a,b){if(!save.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(a,T);o.frequency.exponentialRampToValueAtTime(b,T+.18);g.gain.setValueAtTime(.15,T);g.gain.exponentialRampToValueAtTime(.001,T+.3);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+.3);}catch(e){}}
function bgm(){clearInterval(bt);bt=null;if(save.bgm&&save.snd){var P=[262,294,330,392,440,523,588];bt=setInterval(function(){tone(P[Math.floor(Math.random()*7)],1.2,'sine',.035);if(Math.random()<.4)tone(P[Math.floor(Math.random()*7)]/2,1.5,'triangle',.03,.3);},700);}}
document.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('button'))tone(680,.04,'square',.03);if(!bt&&save.bgm)bgm();});
function applyBg(){if(!matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.style.setProperty('--bg',BGS[save.bg][0]);}
function mas(el){el.innerHTML=ANIMALS.map(function(a,i){return '<span class="mw" data-i="'+i+'">'+(save.hat!=='none'?'<em class="ht">'+save.hat+'</em>':'')+a+'</span>';}).join('');}
function refresh(){['hStars','gStars','pStars','shStars'].forEach(function(k){$(k).textContent=save.stars;});$('hPlays').textContent=save.plays;$('hOk').textContent=save.ok;$('snd').textContent=save.snd?'🔊 おと':'🔇 おと';$('bgm').textContent=save.bgm?'🎵 ON':'🎵 おんがく';mas($('mas'));mas($('mas2'));}
function renderShop(){
  var L=tab==='h'?HATS:BGS,box=$('items');box.innerHTML='';
  $('tabh').classList.toggle('sel',tab==='h');$('tabb').classList.toggle('sel',tab==='b');
  L.forEach(function(it,i){
    var key=tab+':'+(tab==='h'?it[0]:i),own=save.own.indexOf(key)>-1,eq=tab==='h'?save.hat===it[0]:save.bg===i,price=it[2],b=document.createElement('button');
    b.className='gbtn';b.style.background=eq?'var(--lemon)':'var(--card)';if(!own&&save.stars<price)b.style.opacity=.6;
    var ic=tab==='h'?'<b>'+(it[0]==='none'?'🚫':it[0])+'</b>':'<b><i class="dot" style="background:'+it[0]+';margin:0 auto;border:2px solid var(--hole)"></i></b>';
    b.innerHTML=ic+it[1]+'<small>'+(eq?'きている ✓':own?'つかう':save.stars>=price?'⭐'+price+' かえる':'あと ⭐'+(price-save.stars))+'</small>';
    b.onclick=function(){
      if(!own){if(save.stars<price){bad();b.classList.add('shake');return;}save.stars-=price;save.own.push(key);unlock();var r=b.getBoundingClientRect();fx(r.left+r.width/2,r.top,'✨');}
      if(tab==='h')save.hat=it[0];else{save.bg=i;applyBg();}
      persist();refresh();renderShop();};
    box.appendChild(b);});
}
[$('mas'),$('mas2')].forEach(function(c){c.onclick=function(e){var w=e.target.closest('.mw');if(!w)return;var i=+w.dataset.i;chirp(300+i*90,600+i*120);w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop');};});
$('shopb').onclick=function(){show('shop');renderShop();refresh();};
$('sback').onclick=function(){show('home');};
$('tabh').onclick=function(){tab='h';renderShop();};
$('tabb').onclick=function(){tab='b';renderShop();};
$('snd').onclick=function(){save.snd=!save.snd;persist();bgm();refresh();};
$('bgm').onclick=function(){save.bgm=!save.bgm;persist();bgm();refresh();};
applyBg();
refresh();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
